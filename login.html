<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — LearnMath</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">LearnMath ✦</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="register.html" class="nav-button">Join us</a>
    </div>
</header>

<main class="login-page">

    <div class="login-card">

        <div class="login-icon">🚀</div>

        <h1>Welcome back!</h1>

        <p>Continue your math adventure.</p>

        <form>

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter your username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Start learning 🚀
            </button>

        </form>

        <p class="register-text">
            Don't have an account?
            <a href="register.html">Create one</a>
        </p>

    </div>

</main>

<footer>
    LearnMath ✦ Learn. Play. Grow.
</footer>

</body>
</html>
