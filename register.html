<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account — LearnMath</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        LearnMath ✦
    </div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </div>

</header>


<main class="login-page">

    <div class="login-card">

        <div class="login-icon">
            🌟
        </div>

        <h1>Join LearnMath!</h1>

        <p>Create your account and start your adventure.</p>


        <form>

            <label for="name">
                Your name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >


            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Choose a username"
                required
            >


            <label for="grade">
                Your grade
            </label>

            <select id="grade" required>

                <option value="">
                    Choose your grade
                </option>

                <option value="1">
                    Grade 1
                </option>

                <option value="2">
                    Grade 2
                </option>

                <option value="3">
                    Grade 3
                </option>

                <option value="4">
                    Grade 4
                </option>

                <option value="5">
                    Grade 5
                </option>

                <option value="6">
                    Grade 6
                </option>

                <option value="7">
                    Grade 7
                </option>

                <option value="8">
                    Grade 8
                </option>

                <option value="9">
                    Grade 9
                </option>

                <option value="10">
                    Grade 10
                </option>

                <option value="11">
                    Grade 11
                </option>

                <option value="12">
                    Grade 12
                </option>

            </select>


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
            >


            <label for="confirm-password">
                Confirm password
            </label>

            <input
                type="password"
                id="confirm-password"
                placeholder="Repeat your password"
                required
            >


            <button type="submit">
                Create my account 🚀
            </button>

        </form>


        <p class="register-text">

            Already have an account?

            <a href="login.html">
                Log in
            </a>

        </p>

    </div>

</main>


<footer>
    LearnMath ✦ Learn. Play. Grow.
</footer>


</body>
</html>
